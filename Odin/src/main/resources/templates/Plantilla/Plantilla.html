<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Bitácora - Plantilla</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-[#f5f6f8] text-slate-800">

<div class="min-h-screen flex">

    <div th:replace="fragments/layout :: sidebar('plantilla')"></div>
    <div id="overlay" class="fixed inset-0 bg-black/40 z-20 hidden"></div>

    <div class="flex-1 min-w-0">

        <div th:replace="fragments/layout :: topbar('ODIN')"></div>

        <main class="px-4 md:px-8 py-6">

            <section class="mb-6">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 leading-tight uppercase">Bitácora
                            - Plantilla</h1>
                        <p class="text-sm text-slate-500 mt-2">Registro de eventos y acciones del sistema.</p>
                    </div>
                    <div class="flex gap-3">
                        <a th:href="@{/view/plantilla/form}"
                           class="inline-flex items-center justify-center rounded-lg bg-[#2fa300] px-6 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-[#248400] transition">
                            Nuevo Registro
                        </a>
                    </div>
                </div>
            </section>

            <div class="mb-5" th:if="${success != null}">
                <div class="rounded-lg border border-green-200 bg-green-50 px-5 py-3 text-sm text-green-800 shadow-sm"
                     th:text="${success}"></div>
            </div>

            <!-- Buscador -->
            <section class="mb-5">
                <div class="relative">
                    <span class="absolute inset-y-0 left-4 flex items-center text-slate-400">🔍</span>
                    <input placeholder="Buscar por radicado, usuario o acción..." type="text"
                           class="w-full rounded-lg border border-slate-200 bg-white py-3 pl-11 pr-4 text-sm text-slate-600 shadow-sm outline-none focus:border-green-500 focus:ring-2 focus:ring-green-100">
                </div>
            </section>

            <!-- ✅ TABLA CORREGIDA CON CAMPOS DE PLANTILLA -->
            <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">

                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead>
                        <tr class="bg-[#fafafa] border-b border-slate-100 text-[11px] uppercase tracking-wide text-slate-500">
                            <th class="px-5 py-4 text-left font-bold">ID Evento</th>
                            <th class="px-5 py-4 text-left font-bold">Radicado</th>
                            <th class="px-5 py-4 text-left font-bold">Usuario</th>
                            <th class="px-5 py-4 text-left font-bold">Acción</th>
                            <th class="px-5 py-4 text-left font-bold">Descripción</th>
                            <th class="px-5 py-4 text-left font-bold">Fecha</th>
                            <th class="px-5 py-4 text-left font-bold">IP</th>
                            <th class="px-5 py-4 text-center font-bold">Acciones</th>
                        </tr>
                        </thead>

                        <tbody class="divide-y divide-slate-100">
                        <!-- ✅ CAMPOS CORRECTOS DE LA ENTIDAD PLANTILLA -->
                        <tr class="hover:bg-slate-50 transition" th:each="p : ${plantilla}">
                            <td class="px-5 py-4 font-bold text-slate-800" th:text="${p.id_evento}">1</td>
                            <td class="px-5 py-4 text-slate-600" th:text="${p.id_radicado}">-</td>
                            <td class="px-5 py-4 text-slate-600" th:text="${p.id_usuario}">-</td>
                            <td class="px-5 py-4">
                                <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-bold"
                                      th:text="${p.accion}">-</span>
                            </td>
                            <td class="px-5 py-4 text-slate-600 max-w-xs truncate" th:text="${p.descripcion}">-</td>
                            <td class="px-5 py-4 text-slate-600" th:text="${p.fecha}">-</td>
                            <td class="px-5 py-4 text-slate-400 text-xs" th:text="${p.ip != null ? p.ip : '—'}">-</td>
                            <td class="px-5 py-4">
                                <div class="flex items-center justify-center gap-3">
                                    <a class="text-slate-500 hover:text-green-700 transition"
                                       th:href="@{'/view/plantilla/edit/' + ${p.id_evento}}">✏️</a>
                                    <form class="inline" method="post"
                                          th:action="@{'/view/plantilla/delete/' + ${p.id_evento}}">
                                        <button class="text-slate-500 hover:text-red-600 transition" onclick="return confirm('¿Eliminar este registro?')"
                                                type="submit">🗑️
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(plantilla)}">
                            <td class="px-6 py-10 text-center text-slate-500" colspan="8">No hay registros en la
                                bitácora.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="flex items-center justify-between px-5 py-4 border-t border-slate-100 text-xs text-slate-500">
                    <span th:text="'Mostrando ' + ${#lists.size(plantilla)} + ' registros'">Mostrando 0 registros</span>
                </div>
            </section>

        </main>
    </div>
</div>

<script th:src="@{/js/script.js}" defer></script>

</body>
</html>
