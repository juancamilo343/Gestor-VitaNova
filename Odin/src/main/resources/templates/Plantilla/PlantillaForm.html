<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Bitácora - Plantilla</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-[#f5f6f8] text-slate-800">

<div class="min-h-screen flex">

    <div th:replace="fragments/layout :: sidebar('plantilla')"></div>
    <div id="overlay" class="fixed inset-0 bg-black/40 z-20 hidden"></div>

    <div class="flex-1 min-w-0">

        <div th:replace="fragments/layout :: topbar('ODIN')"></div>

        <main class="px-4 md:px-8 py-6">

            <section class="mb-5">
                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 uppercase">
                    Módulo de Bitácora
                </h1>
                <p class="text-sm text-slate-500 mt-1">Registro de eventos y acciones del sistema.</p>
            </section>

            <!-- ✅ FORMULARIO CORREGIDO CON ENTIDAD PLANTILLA -->
            <form method="post"
                  novalidate
                  th:action="@{/view/plantilla/save}"
                  th:object="${plantilla}">

                <input th:field="*{id_evento}" type="hidden"/>

                <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">

                    <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
                        <div class="px-5 py-4 border-b border-slate-100">
                            <h2 class="text-sm font-extrabold text-slate-900 uppercase flex items-center gap-2">📋
                                Información del Evento</h2>
                        </div>

                        <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Radicado
                                    *</label>
                                <input class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-green-600 focus:bg-white" placeholder="ID del radicado" required
                                       th:field="*{id_radicado}"
                                       type="number">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Usuario
                                    *</label>
                                <input class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-green-600 focus:bg-white" placeholder="ID del usuario" required
                                       th:field="*{id_usuario}"
                                       type="number">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Acción
                                    *</label>
                                <select class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-green-600 focus:bg-white" required
                                        th:field="*{accion}">
                                    <option value="">Seleccione</option>
                                    <option value="CREAR">CREAR</option>
                                    <option value="EDITAR">EDITAR</option>
                                    <option value="ELIMINAR">ELIMINAR</option>
                                    <option value="ASIGNAR">ASIGNAR</option>
                                    <option value="REASIGNAR">REASIGNAR</option>
                                    <option value="CERRAR">CERRAR</option>
                                    <option value="FIRMAR">FIRMAR</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Fecha *</label>
                                <input class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-green-600 focus:bg-white" required th:field="*{fecha}"
                                       type="datetime-local">
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Descripción
                                    *</label>
                                <textarea class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-green-600 focus:bg-white resize-none" placeholder="Descripción detallada del evento" required
                                          rows="3"
                                          th:field="*{descripcion}"></textarea>
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">IP
                                    (opcional)</label>
                                <input class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-green-600 focus:bg-white" placeholder="Dirección IP"
                                       th:field="*{ip}"
                                       type="text">
                            </div>

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Acción Detalle
                                    (opcional)</label>
                                <input class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-green-600 focus:bg-white" placeholder="Detalle adicional"
                                       th:field="*{accionDetalle}"
                                       type="text">
                            </div>

                        </div>
                    </section>

                    <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
                        <div class="px-5 py-4 border-b border-slate-100">
                            <h2 class="text-sm font-extrabold text-slate-900 uppercase flex items-center gap-2">📊 Datos
                                Adicionales</h2>
                        </div>

                        <div class="p-5 grid grid-cols-1 gap-4">

                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Datos JSON
                                    (opcional)</label>
                                <textarea class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none focus:border-green-600 focus:bg-white font-mono text-xs" placeholder="Datos adicionales en formato JSON"
                                          rows="8"
                                          th:field="*{datos}"></textarea>
                                <p class="mt-1 text-xs text-slate-400">Ej: {"campo":"valor",
                                    "anterior":"valor_anterior"}</p>
                            </div>

                        </div>
                    </section>

                </div>

                <!-- BOTONES -->
                <div class="flex justify-end gap-3 mt-5">
                    <a class="rounded-lg border border-green-600 bg-white px-6 py-2.5 text-sm font-semibold text-green-700 hover:bg-green-50 transition"
                       th:href="@{/view/plantilla}">
                        Volver
                    </a>
                    <button class="rounded-lg bg-[#168500] px-7 py-2.5 text-sm font-bold text-white hover:bg-[#0f6d00] transition"
                            type="submit">
                        ▶ Guardar Registro
                    </button>
                </div>

            </form>

        </main>
    </div>
</div>

<script th:src="@{/js/script.js}" defer></script>

</body>
</html>
