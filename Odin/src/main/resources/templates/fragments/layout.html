<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ODIN - Sistema</title>
</head>
<body>

<!-- ===================== SIDEBAR ===================== -->
<div th:fragment="sidebar(activeMenu)"
     id="main-sidebar"
     class="w-64 bg-white border-r border-slate-200 min-h-screen flex flex-col font-sans">

    <!-- LOGO -->
    <div class="h-16 flex items-center justify-center border-b border-slate-200 px-6">
        <div class="flex items-center gap-2.5 w-full">
            <div class="w-9 h-9 bg-green-700 rounded-xl flex items-center justify-center text-white shadow-md shadow-green-700/20">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0 0 12 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75Z" />
                </svg>
            </div>
            <span class="font-bold text-slate-800 text-xl tracking-tight">ODIN</span>
        </div>
    </div>

    <!-- MENU DE NAVEGACIÓN -->
    <nav class="flex-1 px-3 py-4 space-y-1 text-sm font-medium">

        <!-- INICIO -->
        <a th:href="@{/view/dashboard}"
           th:classappend="${activeMenu == 'dashboard'} ? 'bg-green-50 text-green-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 opacity-75 group-hover:opacity-100">
                <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
            </svg>
            <span>Panel de Inicio</span>
        </a>

        <!-- DESPLEGABLE: CONTROL DE ACCESO (USUARIOS Y ROLES) -->
        <div class="dropdown-container">
            <button onclick="toggleDropdown('dropdown-usuarios')"
                    type="button"
                    class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200 focus:outline-none group">
                <div class="flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 opacity-75 group-hover:opacity-100">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                    </svg>
                    <span>Control de Acceso</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5 text-slate-400 transition-transform duration-200 dynamic-arrow" id="arrow-dropdown-usuarios">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>

            <div id="dropdown-usuarios" class="hidden pl-11 pr-2 py-1 space-y-1 bg-slate-50/70 rounded-lg mt-0.5 border border-slate-100">
                <a th:href="@{/view/usuarios}"
                   th:classappend="${activeMenu == 'usuarios'} ? 'text-green-700 font-semibold' : 'text-slate-600 hover:text-slate-900'"
                   class="block px-2 py-2 rounded-md transition text-[13px]">
                    Gestión de Usuarios
                </a>
                <a th:href="@{/view/roles}"
                   th:classappend="${activeMenu == 'roles'} ? 'text-green-700 font-semibold' : 'text-slate-600 hover:text-slate-900'"
                   class="block px-2 py-2 rounded-md transition text-[13px]">
                    Roles y Permisos
                </a>
            </div>
        </div>

        <!-- DEPENDENCIAS -->
        <a th:href="@{/view/dependencias}"
           th:classappend="${activeMenu == 'dependencias'} ? 'bg-green-50 text-green-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 opacity-75 group-hover:opacity-100">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v14.25M21.621 15.75H18.75m-.75-12h2.25m-.75 3h1.5m-1.5 3h1.5m-1.5 3H18.75M13.5 3.75h.008v.008H13.5V3.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM13.5 7.5h.008v.008H13.5V7.5Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 21V5.25A2.25 2.25 0 0 0 8.25 3H4.5A2.25 2.25 0 0 0 2.25 5.25V21h8.25ZM10.5 21h7.5V10.5a2.25 2.25 0 0 0-2.25-2.25h-5.25V21Z" />
            </svg>
            <span>Dependencias</span>
        </a>

        <!-- RADICACIÓN -->
        <a th:href="@{/view/radicados}"
           th:classappend="${activeMenu == 'radicacion_Documental'} ? 'bg-green-50 text-green-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 opacity-75 group-hover:opacity-100">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
            <span>Radicación de Documentos</span>
        </a>

        <!-- DESPLEGABLE: GESTIÓN DOCUMENTAL (SERIES, SUBSERIES Y CONSULTA) -->
        <div class="dropdown-container">
            <button onclick="toggleDropdown('dropdown-consulta')"
                    type="button"
                    class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200 focus:outline-none group">
                <div class="flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 opacity-75 group-hover:opacity-100">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                    <span>Gestión Documental</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5 text-slate-400 transition-transform duration-200 dynamic-arrow" id="arrow-dropdown-consulta">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                </svg>
            </button>

            <div id="dropdown-consulta" class="hidden pl-11 pr-2 py-1 space-y-1 bg-slate-50/70 rounded-lg mt-0.5 border border-slate-100">
                <a th:href="@{/view/estados}"
                   th:classappend="${activeMenu == 'consulta'} ? 'text-green-700 font-semibold' : 'text-slate-600 hover:text-slate-900'"
                   class="block px-2 py-2 rounded-md transition text-[13px]">
                    Consulta y Seguimiento
                </a>
                <a th:href="@{/view/series}"
                   th:classappend="${activeMenu == 'series'} ? 'text-green-700 font-semibold' : 'text-slate-600 hover:text-slate-900'"
                   class="block px-2 py-2 rounded-md transition text-[13px]">
                    Series Documentales
                </a>
                <a th:href="@{/view/subseries}"
                   th:classappend="${activeMenu == 'subseries'} ? 'text-green-700 font-semibold' : 'text-slate-600 hover:text-slate-900'"
                   class="block px-2 py-2 rounded-md transition text-[13px]">
                    Subseries Documentales
                </a>
            </div>
        </div>

        <!-- TRÁMITES -->
        <a th:href="@{/view/tramites}"
           th:classappend="${activeMenu == 'tramites'} ? 'bg-green-50 text-green-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200 group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 opacity-75 group-hover:opacity-100">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12a7.5 7.5 0 0 0 15 0m-15 0a7.5 7.5 0 1 1 15 0m-15 0H3m16.5 0H21m-1.5 0H12m-8.457 3.077 1.41-.513m14.095-5.13 1.41-.513M5.106 17.785l1.15-.827m11.379-8.16 1.15-.827M8.14 21.27l.707-1.03m7.45-.808.707-1.03M12 3v1.5m0 15V21m-4.743-10 1.41-.513m11.379 8.16-1.15-.827m-9.33 1.03-.707-1.03" />
            </svg>
            <span>Gestión de Trámites</span>
        </a>

        <!-- REPORTES -->
        <a href="#"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200 group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 opacity-75 group-hover:opacity-100">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v5.625c0 .621-.504 1.125-1.125 1.125h-2.25A1.125 1.125 0 0 1 3 18.75v-5.625ZM13.5 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v10.125c0 .621-.504 1.125-1.125 1.125h-2.25A1.125 1.125 0 0 1 13.5 18.75V8.625ZM8.25 4.125C8.25 3.504 8.754 3 9.375 3h2.25c.621 0 1.125.504 1.125 1.125v14.625c0 .621-.504 1.125-1.125 1.125h-2.25A1.125 1.125 0 0 1 8.25 18.75V4.125Z" />
            </svg>
            <span>Reportes y Estadísticas</span>
        </a>

    </nav>

    <!-- PROCESAMIENTO JAVASCRIPT DEL COMPONENTE -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('main-sidebar');
            const overlay = document.getElementById('overlay');
            if (sidebar) sidebar.classList.toggle('-translate-x-full');
            if (overlay) overlay.classList.toggle('hidden');
        }

        function toggleDropdown(dropdownId) {
            const dropdown = document.getElementById(dropdownId);
            const arrow = document.getElementById('arrow-' + dropdownId);

            if (dropdown) {
                const isHidden = dropdown.classList.contains('hidden');
                if (isHidden) {
                    dropdown.classList.remove('hidden');
                    if (arrow) arrow.style.transform = "rotate(180deg)";
                } else {
                    dropdown.classList.add('hidden');
                    if (arrow) arrow.style.transform = "rotate(0deg)";
                }
            }
        }

        function initMenuState() {
            const currentPath = window.location.pathname;

            if (currentPath.includes('/usuarios') || currentPath.includes('/roles')) {
                const dp = document.getElementById('dropdown-usuarios');
                const ar = document.getElementById('arrow-dropdown-usuarios');
                if (dp) dp.classList.remove('hidden');
                if (ar) ar.style.transform = "rotate(180deg)";
            }
            else if (currentPath.includes('/estados') || currentPath.includes('/series') || currentPath.includes('/subseries')) {
                const dp = document.getElementById('dropdown-consulta');
                const ar = document.getElementById('arrow-dropdown-consulta');
                if (dp) dp.classList.remove('hidden');
                if (ar) ar.style.transform = "rotate(180deg)";
            }

            const activeItem = document.querySelector('.bg-green-50, .bg-green-100, .font-semibold');
            if (activeItem) {
                const parentDropdown = activeItem.closest('[id^="dropdown-"]');
                if (parentDropdown) {
                    parentDropdown.classList.remove('hidden');
                    const arrow = document.getElementById('arrow-' + parentDropdown.id);
                    if (arrow) arrow.style.transform = "rotate(180deg)";
                }
            }
        }

        initMenuState();
        document.addEventListener("DOMContentLoaded", initMenuState);
    </script>
</div>


<!-- ===================== TOPBAR ===================== -->
<div th:fragment="topbar(title)"
     class="h-16 bg-green-700 text-white flex items-center justify-between px-6 shadow-sm font-sans">

    <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden text-white focus:outline-none p-1 rounded hover:bg-green-800 transition">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </button>
        <span class="font-bold text-lg tracking-tight" th:text="${title}">ODIN</span>
    </div>

    <div class="flex items-center gap-5">
        <button class="relative text-white/90 hover:text-white transition p-1 rounded-full hover:bg-green-800/50">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
            </svg>
            <span class="absolute top-1 right-1.5 w-2 h-2 bg-red-500 rounded-full ring-2 ring-green-700"></span>
        </button>

        <div class="flex items-center gap-2.5 cursor-pointer group">
            <div class="w-9 h-9 rounded-xl bg-white text-green-700 flex items-center justify-center font-bold shadow-sm group-hover:scale-105 transition-transform duration-200">
                U
            </div>
        </div>
    </div>

</div>

</body>
</html>
