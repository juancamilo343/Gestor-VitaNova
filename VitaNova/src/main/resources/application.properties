spring.application.name=vitaNova

# --- CONEXION MYSQL (credenciales por variables de entorno, nunca en el repositorio) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vitanova_db}
spring.datasource.username=${DB_USERNAME:vitanova}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CONFIGURACION JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# --- ERRORES ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- ARCHIVOS ADJUNTOS ---
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
