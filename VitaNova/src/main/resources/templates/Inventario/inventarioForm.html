<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('inventario')}">
    </aside>

    <div class="main-wrapper">

        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar}">
        </header>

        <main class="dashboard-content">

            <!-- ENCABEZADO -->
            <section class="page-header">

                <div class="page-title">

                    <h1 th:text="${pageTitle}">
                        Nuevo Inventario
                    </h1>

                    <p th:text="${pageSubtitle}">
                        Registre el inventario de un producto existente.
                    </p>

                </div>

                <div class="page-actions">

                    <a th:href="@{/view/inventario}"
                       class="btn btn-white">

                        <i class="fa-solid fa-arrow-left"></i>

                        <span>
                            Volver
                        </span>

                    </a>

                </div>

            </section>


            <section class="form-box">

                <form th:action="@{/view/inventario/save}"
                      th:object="${inventario}"
                      method="post"
                      novalidate>

                    <input type="hidden"
                           th:field="*{id_inventario}">


                    <!-- PRODUCTO -->
                    <div class="form-section">

                        <h2 class="form-section-title">
                            Producto
                        </h2>

                        <div class="form-section-divider">
                        </div>

                        <div class="form-grid">

                            <div class="field-group wide">

                                <label for="id_producto">
                                    Producto
                                </label>

                                <select id="id_producto"
                                        th:field="*{id_producto}"
                                        required>

                                    <option value="">
                                        Seleccione un producto
                                    </option>

                                    <option th:each="producto : ${productos}"
                                            th:value="${producto.id_producto}"
                                            th:text="${producto.nombre}">
                                        Producto
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <!-- STOCK -->
                    <div class="form-section">

                        <h2 class="form-section-title">
                            Control de existencias
                        </h2>

                        <div class="form-section-divider">
                        </div>

                        <div class="form-grid">

                            <div class="field-group">

                                <label for="stock_actual">
                                    Stock actual
                                </label>

                                <input id="stock_actual"
                                       type="number"
                                       min="0"
                                       th:field="*{stock_actual}"
                                       required>

                            </div>


                            <div class="field-group">

                                <label for="stock_minimo">
                                    Stock mínimo
                                </label>

                                <input id="stock_minimo"
                                       type="number"
                                       min="0"
                                       th:field="*{stock_minimo}"
                                       required>

                            </div>


                            <div class="field-group">

                                <label for="stock_maximo">
                                    Stock máximo
                                </label>

                                <input id="stock_maximo"
                                       type="number"
                                       min="0"
                                       th:field="*{stock_maximo}"
                                       required>

                            </div>

                        </div>

                    </div>


                    <!-- ACCIONES -->
                    <div class="form-actions">

                        <a th:href="@{/view/inventario}"
                           class="btn btn-white">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            Guardar inventario

                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</div>

</body>
</html>
