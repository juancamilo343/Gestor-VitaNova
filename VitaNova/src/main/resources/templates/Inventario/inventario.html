<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('inventario')}">
    </aside>


    <div class="main-wrapper">

        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar}">
        </header>


        <main class="dashboard-content">


            <!-- ENCABEZADO -->
            <section class="page-header">

                <div class="page-title">

                    <h1 th:text="${pageTitle}">
                        Gestión de Inventario
                    </h1>

                    <p th:text="${pageSubtitle}">
                        Consulta y seguimiento del inventario de la farmacia.
                    </p>

                </div>


                <div class="page-actions">

                    <!-- SOLO ADMINISTRADOR Y FARMACÉUTICO -->
                    <a th:if="${puedeModificar}"
                       th:href="@{/view/inventario/form}"
                       class="btn btn-primary">

                        <i class="fa-solid fa-boxes-stacked"></i>

                        <span>
                            Nuevo inventario
                        </span>

                    </a>

                </div>

            </section>


            <!-- MENSAJE ÉXITO -->
            <div th:if="${success}"
                 class="alert-banner success"
                 th:text="${success}">
            </div>


            <!-- MENSAJE ERROR -->
            <div th:if="${error}"
                 class="alert-banner error"
                 th:text="${error}">
            </div>


            <!-- TABLA -->
            <section class="table-card surface">


                <div class="table-header">

                    <span class="card-title">
                        Existencias
                    </span>

                </div>


                <div class="overflow-x-auto">

                    <table class="custom-table">


                        <thead>

                        <tr>

                            <th>
                                Producto
                            </th>

                            <th>
                                Stock actual
                            </th>

                            <th>
                                Stock mínimo
                            </th>

                            <th>
                                Stock máximo
                            </th>

                            <th>
                                Estado
                            </th>

                            <th>
                                Acciones
                            </th>

                        </tr>

                        </thead>


                        <tbody>


                        <tr th:each="inventario : ${inventarios}">


                            <td>

                                <div class="med-cell">

                                    <div class="med-icon">

                                        <i class="fa-solid fa-box"></i>

                                    </div>

                                    <span class="med-name"
                                          th:text="${inventario.producto != null
                                          ? inventario.producto.nombre
                                          : 'Producto no disponible'}">

                                        Producto

                                    </span>

                                </div>

                            </td>


                            <td>

                                <strong th:text="${inventario.stock_actual}">
                                    0
                                </strong>

                            </td>


                            <td>

                                <span th:text="${inventario.stock_minimo}">
                                    0
                                </span>

                            </td>


                            <td>

                                <span th:text="${inventario.stock_maximo}">
                                    0
                                </span>

                            </td>


                            <td>

                                <span th:if="${inventario.stock_actual == 0}"
                                      class="status-pill warning">

                                    Agotado

                                </span>


                                <span th:if="${inventario.stock_actual > 0
                                      and inventario.stock_actual <= inventario.stock_minimo}"
                                      class="status-pill warning">

                                    Stock bajo

                                </span>


                                <span th:if="${inventario.stock_actual > inventario.stock_minimo}"
                                      class="status-pill success">

                                    Disponible

                                </span>

                            </td>


                            <td class="user-table-actions">


                                <div class="table-actions-row">


                                    <!-- VER LOTES -->
                                    <a th:href="@{'/view/inventario/lotes/' + ${inventario.id_producto}}"
                                       class="btn btn-white">

                                        <i class="fa-solid fa-boxes-stacked"></i>

                                        Lotes

                                    </a>


                                    <!-- EDITAR -->
                                    <a th:if="${puedeModificar}"
                                       th:href="@{'/view/inventario/edit/' + ${inventario.id_inventario}}"
                                       class="btn btn-white">

                                        Editar

                                    </a>


                                    <!-- ELIMINAR -->
                                    <form th:if="${puedeModificar}"
                                          method="post"
                                          th:action="@{'/view/inventario/delete/' + ${inventario.id_inventario}}"
                                          class="action-form">

                                        <button type="submit"
                                                class="btn btn-white"
                                                onclick="return confirm('¿¿Eliminar este inventario?')">

                                            ¿Eliminar

                                        </button>

                                    </form>


                                    <!-- SOLO LECTURA -->
                                    <span th:unless="${puedeModificar}"
                                          class="text-muted text-small">

                                        Solo lectura

                                    </span>


                                </div>


                            </td>

                        </tr>


                        <tr th:if="${#lists.isEmpty(inventarios)}">

                            <td colspan="6"
                                class="table-empty">

                                No existen registros de inventario.

                            </td>

                        </tr>


                        </tbody>

                    </table>

                </div>


                <div class="table-footer">

                    Total registros:

                    <span th:text="${#lists.size(inventarios)}">
                        0
                    </span>

                </div>


            </section>


        </main>

    </div>

</div>

</body>

</html>
