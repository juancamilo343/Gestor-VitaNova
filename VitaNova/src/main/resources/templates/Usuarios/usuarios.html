<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('usuarios')}">
    </aside>


    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-wrapper">

        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar}">
        </header>


        <main class="dashboard-content">

            <!-- ENCABEZADO -->
            <section class="page-header">

                <div class="page-title">

                    <h1 th:text="${pageTitle != null ? pageTitle : 'Gestión de Usuarios'}">
                        Gestión de Usuarios
                    </h1>

                    <p th:text="${pageSubtitle != null ? pageSubtitle : 'Consulta y seguimiento de usuarios del sistema.'}">
                        Consulta y seguimiento de usuarios del sistema.
                    </p>

                </div>


                <div class="page-actions">

                    <!-- SOLO ADMINISTRADOR Y FARMACÉUTICO -->
                    <a th:if="${puedeModificar}"
                       th:href="@{/view/usuarios/form}"
                       class="btn btn-primary">

                        <i class="fa-solid fa-user-plus"></i>

                        <span>
                            Nuevo usuario
                        </span>

                    </a>

                </div>

            </section>


            <!-- MENSAJE DE ÉXITO -->
            <div th:if="${success}"
                 class="alert-banner success"
                 th:text="${success}">
            </div>


            <!-- MENSAJE DE ERROR -->
            <div th:if="${error}"
                 class="alert-banner"
                 th:text="${error}">
            </div>


            <!-- TABLA -->
            <section class="table-card surface">

                <div class="table-header">

                    <span class="card-title">
                        Consulta y Seguimiento
                    </span>


                    <form method="get"
                          th:action="@{/view/usuarios}"
                          class="search-form">

                        <input name="search"
                               type="search"
                               th:value="${search}"
                               placeholder="Buscar por usuario o rol"
                               class="search-input search-field">


                        <button type="submit"
                                class="btn btn-white nowrap">

                            Buscar

                        </button>

                    </form>

                </div>


                <div class="overflow-x-auto">

                    <table class="custom-table">

                        <thead>

                        <tr>

                            <th>
                                Usuario
                            </th>

                            <th>
                                Rol
                            </th>

                            <th>
                                Estado
                            </th>

                            <th>
                                Acciones
                            </th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="usuario : ${usuarios}">

                            <!-- USUARIO -->
                            <td>

                                <div class="med-cell">

                                    <div class="med-icon">

                                        <i class="fa-solid fa-user"></i>

                                    </div>


                                    <span class="med-name"
                                          th:text="${usuario.username}">

                                        admin

                                    </span>

                                </div>


                                <span class="text-muted text-small"
                                      th:text="'ID: ' + ${usuario.id_usuario}">

                                    ID: 1

                                </span>

                            </td>


                            <!-- ROL -->
                            <td th:text="${usuario.rol != null ? usuario.rol.nombre : '—'}">

                                Administrador

                            </td>


                            <!-- ESTADO -->
                            <td>

                                <span th:if="${usuario.estado}"
                                      class="status-pill success">

                                    Activo

                                </span>


                                <span th:unless="${usuario.estado}"
                                      class="status-pill warning">

                                    Inactivo

                                </span>

                            </td>


                            <!-- ACCIONES -->
                            <td class="user-table-actions">

                                <!-- ADMINISTRADOR Y FARMACÉUTICO -->
                                <div th:if="${puedeModificar}"
                                     class="table-actions-row">

                                    <a th:href="@{/view/usuarios/edit/{id}(id=${usuario.id_usuario})}"
                                       class="btn btn-white">

                                        <i class="fa-solid fa-pen"></i>

                                        Editar

                                    </a>


                                    <a th:href="@{/view/usuarios/eliminar/{id}(id=${usuario.id_usuario})}"
                                       class="btn btn-white"
                                       onclick="return confirm('¿Eliminar este usuario?')">

                                        <i class="fa-solid fa-trash"></i>

                                        Eliminar

                                    </a>

                                </div>


                                <!-- VENDEDOR Y AUXILIAR -->
                                <span th:unless="${puedeModificar}"
                                      class="text-muted text-small">

                                    Solo lectura

                                </span>

                            </td>

                        </tr>


                        <!-- SIN USUARIOS -->
                        <tr th:if="${#lists.isEmpty(usuarios)}">

                            <td colspan="4"
                                class="table-empty">

                                No existen usuarios registrados.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>


                <!-- FOOTER -->
                <div class="table-footer">

                    Total usuarios:

                    <span th:text="${#lists.size(usuarios)}">
                        0
                    </span>

                </div>

            </section>

        </main>

    </div>

</div>

</body>
</html>
