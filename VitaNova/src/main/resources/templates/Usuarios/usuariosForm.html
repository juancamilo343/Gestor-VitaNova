<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>
<body>
<div class="app-shell">
    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('usuarios')}">
    </aside>
    <div class="main-wrapper">
        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar}">
        </header>
        <main class="dashboard-content">
            <section class="page-header">
                <div class="page-title">
                    <h1 th:text="${pageTitle}">
                        Nuevo Usuario
                    </h1>
                    <p th:text="${pageSubtitle}">
                        Registre y configure un nuevo usuario dentro del sistema VitaNova.
                    </p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/view/usuarios}"
                       class="btn btn-white">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>
                            Volver
                        </span>
                    </a>
                </div>
            </section>
            <section class="form-box">
                <form th:action="@{/view/usuarios/save}"
                      th:object="${usuario}"
                      method="post"
                      novalidate>
                    <input type="hidden"
                           th:field="*{id_usuario}">
                    <!-- INFORMACIÓN DE ACCESO -->
                    <div class="form-section">
                        <h2 class="form-section-title">
                            Información de acceso
                        </h2>
                        <div class="form-section-divider">
                        </div>
                        <div class="form-grid">
                            <div class="field-group wide">
                                <label for="username">
                                    Nombre de usuario
                                </label>
                                <input id="username"
                                       type="text"
                                       th:field="*{username}"
                                       required
                                       placeholder="Ej: juan.perez"
                                       autocomplete="username">
                            </div>
                            <div class="field-group wide">
                                <label for="password">
                                    Contraseña
                                </label>
                                <input id="password"
                                       type="password"
                                       th:field="*{password}"
                                       required
                                       placeholder="Contraseña segura"
                                       autocomplete="new-password">
                            </div>
                        </div>
                    </div>
                    <!-- SEGURIDAD -->
                    <div class="form-section">
                        <h2 class="form-section-title">
                            Seguridad y permisos
                        </h2>
                        <div class="form-section-divider">
                        </div>
                        <div class="form-grid">
                            <div class="field-group">
                                <label for="id_rol">
                                    Rol del usuario
                                </label>
                                <select id="id_rol"
                                        th:field="*{id_rol}"
                                        required>
                                    <option value="">
                                        Seleccione
                                    </option>
                                    <option th:each="rol : ${roles}"
                                            th:value="${rol.id_rol}"
                                            th:text="${rol.nombre}">
                                        Rol
                                    </option>
                                </select>
                            </div>
                            <div class="field-group">
                                <label for="estado">
                                    Estado
                                </label>
                                <select id="estado"
                                        th:field="*{estado}"
                                        required>
                                    <option th:value="true">
                                        Activo
                                    </option>
                                    <option th:value="false">
                                        Inactivo
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <!-- ACCIONES -->
                    <div class="form-actions">
                        <a th:href="@{/view/usuarios}"
                           class="btn btn-white">
                            Cancelar
                        </a>
                        <button type="submit"
                                class="btn btn-primary">
                            Guardar usuario
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>
</body>
</html>
