<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside th:replace="~{fragments/layout :: sidebar('proveedores')}">
  </aside>

  <!-- CONTENIDO -->
  <div class="main-wrapper">

    <!-- TOPBAR -->
    <header th:replace="~{fragments/layout :: topbar}">
    </header>

    <main class="dashboard-content">

      <!-- ENCABEZADO -->
      <section class="page-header">

        <div class="page-title">

          <h1 th:text="${pageTitle}">
            Nuevo Proveedor
          </h1>

          <p th:text="${pageSubtitle}">
            Registre un nuevo proveedor dentro del sistema VitaNova.
          </p>

        </div>

        <div class="page-actions">

          <a th:href="@{/view/proveedores}"
             class="btn btn-white">

            <i class="fa-solid fa-arrow-left"></i>

            <span>
              Volver
            </span>

          </a>

        </div>

      </section>

      <!-- MENSAJE ERROR -->
      <div th:if="${error}"
           class="alert-banner error"
           th:text="${error}">
      </div>

      <!-- FORMULARIO -->
      <section class="form-box">

        <form th:action="@{/view/proveedores/save}"
              th:object="${proveedor}"
              method="post">

          <!-- ID -->
          <input type="hidden"
                 th:field="*{id_proveedor}">

          <!-- SECCIÓN 1: DATOS DE LA EMPRESA -->
          <div class="form-section">

            <h2 class="form-section-title">
              <i class="fa-solid fa-building" style="color: var(--primary); margin-right: 8px;"></i>
              Información de la Empresa
            </h2>

            <div class="form-section-divider"></div>

            <div class="form-grid">

              <!-- NOMBRE -->
              <div class="field-group">

                <label for="nombre">
                  Nombre del proveedor o Razón Social <span style="color: #ef4444;">*</span>
                </label>

                <input id="nombre"
                       type="text"
                       th:field="*{nombre}"
                       maxlength="100"
                       required
                       placeholder="Ej: Laboratorios Baxter S.A.S.">

              </div>

              <!-- NIT -->
              <div class="field-group">

                <label for="nit">
                  NIT o Identificación Tributaria
                </label>

                <input id="nit"
                       type="text"
                       th:field="*{nit}"
                       maxlength="20"
                       placeholder="Ej: 900.123.456-7">

              </div>

              <!-- TIPO PRODUCTOS -->
              <div class="field-group wide">

                <label for="tipo_productos_suministrados">
                  Tipo de productos suministrados
                </label>

                <input id="tipo_productos_suministrados"
                       type="text"
                       th:field="*{tipo_productos_suministrados}"
                       maxlength="200"
                       placeholder="Ej: Medicamentos genéricos, analgésicos, material de curación">

              </div>

              <!-- ESTADO -->
              <div class="field-group">

                <label for="estado">
                  Estado comercial
                </label>

                <select id="estado"
                        th:field="*{estado}">

                  <option value="ACTIVO">
                    Activo (Habilitado para compras)
                  </option>

                  <option value="INACTIVO">
                    Inactivo (Suspendido)
                  </option>

                </select>

              </div>

            </div>

          </div>

          <!-- SECCIÓN 2: CONTACTO Y UBICACIÓN -->
          <div class="form-section">

            <h2 class="form-section-title">
              <i class="fa-solid fa-address-book" style="color: var(--primary); margin-right: 8px;"></i>
              Contacto y Ubicación
            </h2>

            <div class="form-section-divider"></div>

            <div class="form-grid">

              <!-- CONTACTO -->
              <div class="field-group">

                <label for="nombre_contacto">
                  Nombre de la persona de contacto
                </label>

                <input id="nombre_contacto"
                       type="text"
                       th:field="*{nombre_contacto}"
                       maxlength="100"
                       placeholder="Ej: Andrea Moreno">

              </div>

              <!-- TELÉFONO -->
              <div class="field-group">

                <label for="telefono">
                  Teléfono o PBX de contacto
                </label>

                <input id="telefono"
                       type="text"
                       th:field="*{telefono}"
                       maxlength="20"
                       placeholder="Ej: (601) 745-0000 / 310-000-0000">

              </div>

              <!-- CORREO -->
              <div class="field-group">

                <label for="correo">
                  Correo electrónico comercial
                </label>

                <input id="correo"
                       type="email"
                       th:field="*{correo}"
                       maxlength="100"
                       placeholder="Ej: pedidos@proveedor.com">

              </div>

              <!-- DIRECCIÓN -->
              <div class="field-group">

                <label for="direccion">
                  Dirección comercial / Bodega
                </label>

                <input id="direccion"
                       type="text"
                       th:field="*{direccion}"
                       maxlength="150"
                       placeholder="Ej: Calle 26 # 68C-61 Edificio Central">

              </div>

            </div>

          </div>

          <!-- ACCIONES -->
          <div class="form-actions">

            <a th:href="@{/view/proveedores}"
               class="btn btn-white">

              <i class="fa-solid fa-xmark"></i>

              <span>
                Cancelar
              </span>

            </a>

            <button type="submit"
                    class="btn btn-primary">

              <i class="fa-solid fa-floppy-disk"></i>

              <span th:text="${editMode ? 'Actualizar proveedor' : 'Guardar proveedor'}">
                Guardar proveedor
              </span>

            </button>

          </div>

        </form>

      </section>

    </main>

  </div>

</div>

</body>
</html>
