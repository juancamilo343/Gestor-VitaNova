<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

  <aside th:replace="~{fragments/layout :: sidebar('proveedores')}">
  </aside>


  <div class="main-wrapper">

    <header th:replace="~{fragments/layout :: topbar}">
    </header>


    <main class="dashboard-content">

      <section class="page-header">

        <div class="page-title">

          <h1 th:text="${pageTitle}">
            Nuevo Proveedor
          </h1>

          <p th:text="${pageSubtitle}">
            Registre un nuevo proveedor dentro del sistema VitaNova.
          </p>

        </div>


        <div class="page-actions">

          <a th:href="@{/view/proveedores}"
             class="btn btn-white">

            <i class="fa-solid fa-arrow-left"></i>

            <span>
                            Volver
                        </span>

          </a>

        </div>

      </section>


      <section class="form-box">

        <form th:action="@{/view/proveedores/save}"
              th:object="${proveedor}"
              method="post"
              novalidate>

          <input type="hidden"
                 th:field="*{id_proveedor}">


          <!-- INFORMACIÓN GENERAL -->
          <div class="form-section">

            <h2 class="form-section-title">
              Información del proveedor
            </h2>

            <div class="form-section-divider">
            </div>


            <div class="form-grid">

              <div class="field-group wide">

                <label for="nombre">
                  Nombre del proveedor
                </label>

                <input id="nombre"
                       type="text"
                       th:field="*{nombre}"
                       required
                       placeholder="Ej: Laboratorios XYZ">

              </div>


              <div class="field-group">

                <label for="nit">
                  NIT
                </label>

                <input id="nit"
                       type="text"
                       th:field="*{nit}"
                       placeholder="Ej: 900123456-1">

              </div>


              <div class="field-group">

                <label for="nombre_contacto">
                  Nombre de contacto
                </label>

                <input id="nombre_contacto"
                       type="text"
                       th:field="*{nombre_contacto}"
                       placeholder="Nombre del contacto">

              </div>

            </div>

          </div>


          <!-- CONTACTO -->
          <div class="form-section">

            <h2 class="form-section-title">
              Información de contacto
            </h2>

            <div class="form-section-divider">
            </div>


            <div class="form-grid">

              <div class="field-group">

                <label for="telefono">
                  Teléfono
                </label>

                <input id="telefono"
                       type="text"
                       th:field="*{telefono}"
                       placeholder="Número de teléfono">

              </div>


              <div class="field-group">

                <label for="correo">
                  Correo electrónico
                </label>

                <input id="correo"
                       type="email"
                       th:field="*{correo}"
                       placeholder="correo@ejemplo.com">

              </div>


              <div class="field-group wide">

                <label for="direccion">
                  Dirección
                </label>

                <input id="direccion"
                       type="text"
                       th:field="*{direccion}"
                       placeholder="Dirección del proveedor">

              </div>

            </div>

          </div>


          <!-- PRODUCTOS Y ESTADO -->
          <div class="form-section">

            <h2 class="form-section-title">
              Productos y estado
            </h2>

            <div class="form-section-divider">
            </div>


            <div class="form-grid">

              <div class="field-group wide">

                <label for="tipo_productos_suministrados">
                  Tipo de productos suministrados
                </label>

                <input id="tipo_productos_suministrados"
                       type="text"
                       th:field="*{tipo_productos_suministrados}"
                       placeholder="Ej: Medicamentos, vitaminas y productos de aseo">

              </div>


              <div class="field-group">

                <label for="estado">
                  Estado
                </label>

                <select id="estado"
                        th:field="*{estado}"
                        required>

                  <option value="ACTIVO">
                    Activo
                  </option>

                  <option value="INACTIVO">
                    Inactivo
                  </option>

                </select>

              </div>

            </div>

          </div>


          <!-- ACCIONES -->
          <div class="form-actions">

            <a th:href="@{/view/proveedores}"
               class="btn btn-white">

              Cancelar

            </a>


            <button type="submit"
                    class="btn btn-primary">

              Guardar proveedor

            </button>

          </div>

        </form>

      </section>

    </main>

  </div>

</div>

</body>
</html>
