<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside th:replace="~{fragments/layout :: sidebar('proveedores')}">
  </aside>


  <!-- CONTENIDO -->
  <div class="main-wrapper">

    <!-- TOPBAR -->
    <header th:replace="~{fragments/layout :: topbar}">
    </header>


    <main class="dashboard-content">

      <!-- ENCABEZADO -->
      <section class="page-header">

        <div class="page-title">

          <h1 th:text="${pageTitle}">
            Nuevo Proveedor
          </h1>

          <p th:text="${pageSubtitle}">
            Registre un nuevo proveedor dentro del sistema VitaNova.
          </p>

        </div>

      </section>


      <!-- FORMULARIO -->
      <section class="table-card surface form-card">

        <form th:action="@{/view/proveedores/save}"
              th:object="${proveedor}"
              method="post">

          <!-- ID -->
          <input type="hidden"
                 th:field="*{id_proveedor}">


          <h3 class="mb-3">
            Información del proveedor
          </h3>


          <div class="row">

            <!-- NOMBRE -->
            <div class="col-md-6 mb-3">

              <label class="form-label">
                Nombre del proveedor
              </label>

              <input type="text"
                     th:field="*{nombre}"
                     class="form-control"
                     maxlength="100"
                     required>

            </div>


            <!-- CONTACTO -->
            <div class="col-md-6 mb-3">

              <label class="form-label">
                Nombre de contacto
              </label>

              <input type="text"
                     th:field="*{nombre_contacto}"
                     class="form-control"
                     maxlength="100">

            </div>


            <!-- NIT -->
            <div class="col-md-6 mb-3">

              <label class="form-label">
                NIT
              </label>

              <input type="text"
                     th:field="*{nit}"
                     class="form-control"
                     maxlength="20">

            </div>


            <!-- TELÉFONO -->
            <div class="col-md-6 mb-3">

              <label class="form-label">
                Teléfono
              </label>

              <input type="text"
                     th:field="*{telefono}"
                     class="form-control"
                     maxlength="20">

            </div>


            <!-- CORREO -->
            <div class="col-md-6 mb-3">

              <label class="form-label">
                Correo electrónico
              </label>

              <input type="email"
                     th:field="*{correo}"
                     class="form-control"
                     maxlength="100">

            </div>


            <!-- DIRECCIÓN -->
            <div class="col-md-6 mb-3">

              <label class="form-label">
                Dirección
              </label>

              <input type="text"
                     th:field="*{direccion}"
                     class="form-control"
                     maxlength="150">

            </div>


            <!-- TIPO PRODUCTOS -->
            <div class="col-12 mb-3">

              <label class="form-label">
                Tipo de productos suministrados
              </label>

              <input type="text"
                     th:field="*{tipo_productos_suministrados}"
                     class="form-control"
                     maxlength="200">

            </div>


            <!-- ESTADO -->
            <div class="col-md-6 mb-3">

              <label class="form-label">
                Estado
              </label>

              <select th:field="*{estado}"
                      class="form-select">

                <option value="ACTIVO">
                  Activo
                </option>

                <option value="INACTIVO">
                  Inactivo
                </option>

              </select>

            </div>

          </div>


          <div class="mt-3">

            <button type="submit"
                    class="btn btn-primary">

                            <span th:text="${editMode ? 'Actualizar proveedor' : 'Guardar proveedor'}">
                                Guardar proveedor
                            </span>

            </button>


            <a th:href="@{/view/proveedores}"
               class="btn btn-white">

              Cancelar

            </a>

          </div>

        </form>

      </section>

    </main>

  </div>

</div>

</body>
</html>
