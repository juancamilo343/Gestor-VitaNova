<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(pageTitle)">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle != null ? pageTitle + ' | VitaNova PHARMA ERP' : 'VitaNova PHARMA ERP'}">
        VitaNova PHARMA ERP
    </title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside th:fragment="sidebar(activeMenu)"
       class="sidebar">

    <!-- MARCA -->
    <div class="sidebar-brand">

        <div class="brand-icon">
            <i class="fa-solid fa-prescription-bottle-medical"></i>
        </div>

        <div class="brand-text">

            <span class="brand-name">
                VitaNova
            </span>

            <span class="brand-subtitle">
                PHARMA ERP
            </span>

        </div>

    </div>


    <!-- USUARIO ACTUAL -->
    <div class="sidebar-user">

        <div class="sidebar-user-avatar">
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="sidebar-user-info">

            <span class="sidebar-user-name"
                  th:text="${usuarioActual}">
                admin
            </span>

            <span class="sidebar-user-role"
                  th:text="${rolUsuarioActual}">
                Administrador
            </span>

        </div>

    </div>


    <!-- MENÚ -->
    <nav class="sidebar-nav">

        <!-- DASHBOARD -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','FARMACEUTICO','VENDEDOR')"
           th:href="@{/view/dashboard}"
           class="nav-link"
           th:classappend="${activeMenu == 'dashboard'} ? ' active'">

            <i class="fa-solid fa-chart-line"></i>

            <span>
                Dashboard
            </span>

        </a>


        <!-- CLIENTES -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','FARMACEUTICO','VENDEDOR')"
           th:href="@{/view/clientes}"
           class="nav-link"
           th:classappend="${activeMenu == 'clientes'} ? ' active'">

            <i class="fa-solid fa-users"></i>

            <span>
                Clientes
            </span>

        </a>


        <!-- PRODUCTOS -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','FARMACEUTICO','VENDEDOR')"
           th:href="@{/view/productos}"
           class="nav-link"
           th:classappend="${activeMenu == 'productos'} ? ' active'">

            <i class="fa-solid fa-pills"></i>

            <span>
                Productos
            </span>

        </a>


        <!-- CATEGORÍAS -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','FARMACEUTICO')"
           th:href="@{/view/categorias}"
           class="nav-link"
           th:classappend="${activeMenu == 'categorias'} ? ' active'">

            <i class="fa-solid fa-layer-group"></i>

            <span>
                Categorías
            </span>

        </a>


        <!-- INVENTARIO -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','FARMACEUTICO','VENDEDOR')"
           th:href="@{/view/inventario}"
           class="nav-link"
           th:classappend="${activeMenu == 'inventario'} ? ' active'">

            <i class="fa-solid fa-boxes-stacked"></i>

            <span>
                Inventario
            </span>

        </a>


        <!-- VENTAS -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','FARMACEUTICO','VENDEDOR')"
           th:href="@{/view/ventas/form}"
           class="nav-link"
           th:classappend="${activeMenu == 'ventas'} ? ' active'">

            <i class="fa-solid fa-cart-shopping"></i>

            <span>
                Ventas
            </span>

        </a>


        <!-- COMPRAS -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','FARMACEUTICO')"
           th:href="@{/view/compras}"
           class="nav-link"
           th:classappend="${activeMenu == 'compras'} ? ' active'">

            <i class="fa-solid fa-cart-flatbed"></i>

            <span>
                Compras
            </span>

        </a>


        <!-- PROVEEDORES -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','FARMACEUTICO')"
           th:href="@{/view/proveedores}"
           class="nav-link"
           th:classappend="${activeMenu == 'proveedores'} ? ' active'">

            <i class="fa-solid fa-truck-field"></i>

            <span>
                Proveedores
            </span>

        </a>


        <!-- EMPLEADOS -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','FARMACEUTICO')"
           th:href="@{/view/empleados}"
           class="nav-link"
           th:classappend="${activeMenu == 'empleados'} ? ' active'">

            <i class="fa-solid fa-user-tie"></i>

            <span>
                Empleados
            </span>

        </a>


        <!-- USUARIOS -->
        <a sec:authorize="hasRole('ADMINISTRADOR')"
           th:href="@{/view/usuarios}"
           class="nav-link"
           th:classappend="${activeMenu == 'usuarios'} ? ' active'">

            <i class="fa-solid fa-user-gear"></i>

            <span>
                Usuarios
            </span>

        </a>


        <!-- ROLES -->
        <a sec:authorize="hasRole('ADMINISTRADOR')"
           th:href="@{/view/rol}"
           class="nav-link"
           th:classappend="${activeMenu == 'rol' or activeMenu == 'roles'} ? ' active'">

            <i class="fa-solid fa-shield-halved"></i>

            <span>
                Roles
            </span>

        </a>


        <!-- REPORTES -->
        <a sec:authorize="hasAnyRole('ADMINISTRADOR','FARMACEUTICO')"
           th:href="@{/view/reportes}"
           class="nav-link"
           th:classappend="${activeMenu == 'reportes'} ? ' active'">

            <i class="fa-solid fa-file-lines"></i>

            <span>
                Reportes
            </span>

        </a>

    </nav>


    <!-- CERRAR SESIÓN -->
    <div class="sidebar-footer">

        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="logout-link">

                <i class="fa-solid fa-arrow-right-from-bracket"></i>

                <span>
                    Cerrar sesión
                </span>

            </button>

        </form>

    </div>

</aside>


<!-- =========================================================
     TOPBAR
========================================================= -->

<header th:fragment="topbar"
        class="topbar">
</header>


<!-- =========================================================
     SCRIPTS
========================================================= -->

<script th:fragment="scripts">

</script>

</html>
