<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

    ```
    <aside th:replace="~{fragments/layout :: sidebar('ventas')}">
    </aside>

    <div class="main-wrapper">

        <header th:replace="~{fragments/layout :: topbar}">
        </header>

        <main class="dashboard-content">

            <!-- =================================================
                 HEADER
            ================================================== -->

            <section class="page-header">

                <div class="page-title">

                    <h1 th:text="${pageTitle}">
                        Agregar producto
                    </h1>

                    <p th:text="${pageSubtitle}">
                        Agregue un producto a la venta seleccionada.
                    </p>

                </div>

                <div class="page-actions">

                    <a th:href="@{/view/ventas/{id}/detalles(id=${venta.id_venta})}"
                       class="btn btn-secondary">

                        ← Volver a detalles

                    </a>

                </div>

            </section>


            <!-- =================================================
                 FORMULARIO
            ================================================== -->

            <section class="form-box">

                <div class="form-box-header">

                    <h2>
                        Formulario detalle de venta
                    </h2>

                </div>


                <div class="form-box-content">

                    <form th:action="@{/view/ventas/{id}/detalles/save(id=${venta.id_venta})}"
                          th:object="${detalle}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id_detalle_venta}">

                        <input type="hidden"
                               th:field="*{id_venta}">


                        <!-- =================================================
                             PRODUCTO
                        ================================================== -->

                        <div class="form-grid">

                            <!-- PRODUCTO -->

                            <div class="field-group">

                                <label for="id_producto">
                                    Producto
                                </label>

                                <select id="id_producto"
                                        th:field="*{id_producto}"
                                        required>

                                    <option value="">
                                        Seleccione un producto
                                    </option>

                                    <option th:each="producto : ${productos}"
                                            th:value="${producto.id_producto}"
                                            th:data-precio="${producto.precio_venta}"
                                            th:text="${producto.nombre +
                                                 ' - $' +
                                                 #numbers.formatDecimal(
                                                     producto.precio_venta,
                                                     1,
                                                     2
                                                 )}">
                                    </option>

                                </select>

                            </div>


                            <!-- CANTIDAD -->

                            <div class="field-group">

                                <label for="cantidad">
                                    Cantidad
                                </label>

                                <input id="cantidad"
                                       type="number"
                                       min="1"
                                       step="1"
                                       th:field="*{cantidad}"
                                       required>

                                <small id="mensaje-stock">
                                    El sistema validará el stock disponible.
                                </small>

                            </div>


                            <!-- PRECIO -->

                            <div class="field-group">

                                <label for="precio">
                                    Precio de venta
                                </label>

                                <input id="precio"
                                       type="number"
                                       step="0.01"
                                       min="0"
                                       th:field="*{precio}"
                                       readonly>

                            </div>


                            <!-- SUBTOTAL -->

                            <div class="field-group">

                                <label for="subtotal">
                                    Subtotal
                                </label>

                                <input id="subtotal"
                                       type="number"
                                       step="0.01"
                                       min="0"
                                       th:field="*{subtotal}"
                                       readonly>

                            </div>

                        </div>


                        <!-- =================================================
                             INFORMACIÓN DE LA VENTA
                        ================================================== -->

                        <section class="form-box"
                                 style="margin-top: 24px;">

                            <div class="form-box-header">

                                <h2>
                                    Venta seleccionada
                                </h2>

                            </div>

                            <div class="form-box-content">

                                <div class="form-grid">


                                    <!-- VENTA -->

                                    <div class="field-group">

                                        <label>
                                            Venta
                                        </label>

                                        <input type="text"
                                               th:value="${'Venta #' + venta.id_venta}"
                                               readonly>

                                    </div>


                                    <!-- FECHA -->

                                    <div class="field-group">

                                        <label>
                                            Fecha
                                        </label>

                                        <input type="text"
                                               th:value="${venta.fecha != null
                                               ? #temporals.format(
                                                   venta.fecha,
                                                   'dd/MM/yyyy HH:mm'
                                                 )
                                               : '-'}"
                                               readonly>

                                    </div>


                                    <!-- TOTAL ACTUAL -->

                                    <div class="field-group">

                                        <label>
                                            Total actual
                                        </label>

                                        <input id="totalActual"
                                               type="text"
                                               th:value="${venta.total != null
                                               ? '$ ' +
                                                 #numbers.formatDecimal(
                                                     venta.total,
                                                     1,
                                                     2
                                                 )
                                               : '$ 0.00'}"
                                               readonly>

                                    </div>

                                </div>

                            </div>

                        </section>


                        <!-- =================================================
                             BOTONES
                        ================================================== -->

                        <div class="form-actions">

                            <a th:href="@{/view/ventas/{id}/detalles(id=${venta.id_venta})}"
                               class="btn btn-white">

                                <i class="fa-solid fa-arrow-left"></i>

                                Cancelar

                            </a>

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="fa-solid fa-floppy-disk"></i>

                                <span th:if="${editMode}">
                                Actualizar detalle
                            </span>

                                <span th:unless="${editMode}">
                                Agregar producto
                            </span>

                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </main>

    </div>
    ```

</div>

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const producto =
            document.getElementById("id_producto");

        const cantidad =
            document.getElementById("cantidad");

        const precio =
            document.getElementById("precio");

        const subtotal =
            document.getElementById("subtotal");


        function calcularSubtotal() {

            const cantidadValor =
                parseFloat(cantidad.value) || 0;

            const precioValor =
                parseFloat(precio.value) || 0;

            subtotal.value =
                (cantidadValor * precioValor).toFixed(2);
        }


        function cargarPrecio() {

            const opcion =
                producto.options[
                    producto.selectedIndex
                    ];


            if (!opcion || !opcion.value) {

                precio.value = "0.00";

                calcularSubtotal();

                return;
            }


            const precioProducto =
                opcion.getAttribute("data-precio");


            precio.value =
                precioProducto || "0.00";


            calcularSubtotal();
        }


        if (producto) {

            producto.addEventListener(
                "change",
                cargarPrecio
            );
        }


        if (cantidad) {

            cantidad.addEventListener(
                "input",
                calcularSubtotal
            );
        }


        cargarPrecio();

    });

</script>

</body>

</html>
