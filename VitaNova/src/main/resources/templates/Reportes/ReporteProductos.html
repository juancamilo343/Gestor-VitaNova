<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Reporte de Productos - VitaNova</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #222;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .encabezado h1 {
            margin-bottom: 5px;
        }

        .encabezado h2 {
            margin-top: 5px;
        }

        .encabezado p {
            margin: 3px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .acciones {
            margin-bottom: 25px;
            text-align: right;
        }

        .acciones button {
            padding: 10px 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            background-color: #39A900;
            color: white;
            font-size: 14px;
        }

        @media print {

            .acciones {
                display: none;
            }

            body {
                margin: 15px;
            }
        }

    </style>

</head>

<body>

<div class="acciones">

    <button onclick="window.print()">
        Imprimir / Guardar PDF
    </button>

</div>


<div class="encabezado">

    <h1>VitaNova PHARMA ERP</h1>

    <h2>Reporte de Productos</h2>

    <p>
        Productos registrados en VitaNova
    </p>

    <p>
        Fecha de generación:
        <span th:text="${fechaGeneracion}">
            -
        </span>
    </p>

</div>


<table>

    <thead>

    <tr>

        <th>ID</th>

        <th>Nombre</th>

        <th>Código Interno</th>

        <th>Código de Barras</th>

        <th>Precio Compra</th>

        <th>Precio Venta</th>

        <th>Ubicación</th>

        <th>Estado</th>

        <th>ID Categoría</th>

        <th>ID Proveedor</th>

    </tr>

    </thead>


    <tbody>

    <tr th:each="producto : ${productos}">

        <td th:text="${producto.id_producto}">
            -
        </td>

        <td th:text="${producto.nombre}">
            -
        </td>

        <td th:text="${producto.codigo_interno != null ? producto.codigo_interno : '-'}">
            -
        </td>

        <td th:text="${producto.codigo_barras != null ? producto.codigo_barras : '-'}">
            -
        </td>

        <td>

            $

            <span th:text="${producto.precio_compra != null ? #numbers.formatDecimal(producto.precio_compra, 0, 'POINT', 2, 'COMMA') : '0,00'}">
                0,00
            </span>

        </td>

        <td>

            $

            <span th:text="${producto.precio_venta != null ? #numbers.formatDecimal(producto.precio_venta, 0, 'POINT', 2, 'COMMA') : '0,00'}">
                0,00
            </span>

        </td>

        <td th:text="${producto.ubicacion != null ? producto.ubicacion : '-'}">
            -
        </td>

        <td th:text="${producto.estado}">
            -
        </td>

        <td th:text="${producto.id_categoria}">
            -
        </td>

        <td th:text="${producto.id_proveedor}">
            -
        </td>

    </tr>

    </tbody>

</table>


</body>
</html>
