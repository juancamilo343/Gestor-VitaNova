<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Reporte de Ventas - VitaNova</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #222;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .encabezado h1 {
            margin-bottom: 5px;
        }

        .encabezado p {
            margin: 3px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .total {
            margin-top: 25px;
            text-align: right;
            font-size: 18px;
            font-weight: bold;
        }

        .acciones {
            margin-bottom: 25px;
            text-align: right;
        }

        .acciones button {
            padding: 10px 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            background-color: #39A900;
            color: white;
            font-size: 14px;
        }

        @media print {
            .acciones {
                display: none;
            }

            body {
                margin: 15px;
            }
        }
    </style>
</head>

<body>

<div class="acciones">
    <button onclick="window.print()">
        Imprimir / Guardar PDF
    </button>
</div>

<div class="encabezado">

    <h1>VitaNova PHARMA ERP</h1>

    <h2>Reporte de Ventas</h2>

    <p>
        Ventas registradas con estado PAGADA
    </p>

    <p>
        Fecha de generación:
        <span th:text="${fechaGeneracion}"></span>
    </p>

</div>

<table>

    <thead>
    <tr>
        <th>ID</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Descuento</th>
        <th>Impuestos</th>
        <th>Estado</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="venta : ${ventas}">

        <td th:text="${venta.id_venta}"></td>

        <td th:text="${venta.fecha != null ? #temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm') : '-'}"></td>

        <td>
            $
            <span th:text="${venta.total != null ? #numbers.formatDecimal(venta.total, 0, 'POINT', 2, 'COMMA') : '0,00'}">
                0,00
            </span>
        </td>

        <td>
            $
            <span th:text="${venta.descuento != null ? #numbers.formatDecimal(venta.descuento, 0, 'POINT', 2, 'COMMA') : '0,00'}">
                0,00
            </span>
        </td>

        <td>
            $
            <span th:text="${venta.impuestos != null ? #numbers.formatDecimal(venta.impuestos, 0, 'POINT', 2, 'COMMA') : '0,00'}">
                0,00
            </span>
        </td>

        <td th:text="${venta.estado}"></td>

    </tr>

    </tbody>

</table>

<div class="total">

    Total de ventas pagadas:

    $
    <span th:text="${#numbers.formatDecimal(totalVentas, 0, 'POINT', 2, 'COMMA')}">
        0,00
    </span>

</div>

</body>
</html>
