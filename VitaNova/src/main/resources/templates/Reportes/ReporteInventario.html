<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Reporte de Inventario - VitaNova</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #222;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .encabezado h1 {
            margin-bottom: 5px;
        }

        .encabezado h2 {
            margin-top: 5px;
        }

        .encabezado p {
            margin: 3px 0;
        }

        .resumen {
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .acciones {
            margin-bottom: 25px;
            text-align: right;
        }

        .acciones button {
            padding: 10px 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            background-color: #39A900;
            color: white;
            font-size: 14px;
        }

        .stock-bajo {
            font-weight: bold;
        }

        @media print {

            .acciones {
                display: none;
            }

            body {
                margin: 15px;
            }
        }

    </style>

</head>

<body>

<div class="acciones">

    <button onclick="window.print()">
        Imprimir / Guardar PDF
    </button>

</div>


<div class="encabezado">

    <h1>VitaNova PHARMA ERP</h1>

    <h2>Reporte de Inventario</h2>

    <p>
        Existencias, stock mínimo y stock máximo
    </p>

    <p>
        Fecha de generación:
        <span th:text="${fechaGeneracion}">
            -
        </span>
    </p>

</div>


<div class="resumen">

    <strong>Productos con stock bajo:</strong>

    <span th:text="${productosStockBajo}">
        0
    </span>

</div>


<table>

    <thead>

    <tr>

        <th>ID Inventario</th>

        <th>ID Producto</th>

        <th>Producto</th>

        <th>Stock Actual</th>

        <th>Stock Mínimo</th>

        <th>Stock Máximo</th>

        <th>Estado</th>

    </tr>

    </thead>


    <tbody>

    <tr th:each="inventario : ${inventarios}">

        <td th:text="${inventario.id_inventario}">
            -
        </td>

        <td th:text="${inventario.id_producto}">
            -
        </td>

        <td th:text="${inventario.producto != null ? inventario.producto.nombre : '-'}">
            -
        </td>

        <td th:text="${inventario.stock_actual}">
            0
        </td>

        <td th:text="${inventario.stock_minimo}">
            0
        </td>

        <td th:text="${inventario.stock_maximo}">
            0
        </td>

        <td>

            <span
                    th:if="${inventario.stock_actual != null
                    && inventario.stock_minimo != null
                    && inventario.stock_actual <= inventario.stock_minimo}"
                    class="stock-bajo">

                Stock bajo

            </span>

            <span
                    th:unless="${inventario.stock_actual != null
                    && inventario.stock_minimo != null
                    && inventario.stock_actual <= inventario.stock_minimo}">

                Normal

            </span>

        </td>

    </tr>

    </tbody>

</table>


</body>
</html>
