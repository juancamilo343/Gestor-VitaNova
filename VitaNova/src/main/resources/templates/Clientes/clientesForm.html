<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('clientes')}">
    </aside>


    <!-- CONTENIDO -->
    <div class="main-wrapper">

        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar}">
        </header>


        <main class="dashboard-content">

            <!-- ENCABEZADO -->
            <section class="page-header">

                <div class="page-title">

                    <h1 th:text="${pageTitle}">
                        Nuevo Cliente
                    </h1>

                    <p th:text="${pageSubtitle}">
                        Registre un nuevo cliente dentro del sistema VitaNova.
                    </p>

                </div>

            </section>


            <!-- FORMULARIO -->
            <section class="table-card surface form-card">

                <form th:action="@{/view/clientes/save}"
                      th:object="${cliente}"
                      method="post">

                    <!-- ID -->
                    <input type="hidden"
                           th:field="*{id_cliente}">


                    <h3 class="mb-3">
                        Información del cliente
                    </h3>


                    <div class="row">

                        <!-- NOMBRES -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Nombres
                            </label>

                            <input type="text"
                                   th:field="*{nombres}"
                                   class="form-control"
                                   maxlength="100"
                                   required>

                        </div>


                        <!-- APELLIDOS -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Apellidos
                            </label>

                            <input type="text"
                                   th:field="*{apellidos}"
                                   class="form-control"
                                   maxlength="100">

                        </div>


                        <!-- DOCUMENTO -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Documento
                            </label>

                            <input type="text"
                                   th:field="*{documento}"
                                   class="form-control"
                                   maxlength="20"
                                   required>

                        </div>


                        <!-- TELÉFONO -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Teléfono
                            </label>

                            <input type="text"
                                   th:field="*{telefono}"
                                   class="form-control"
                                   maxlength="20">

                        </div>


                        <!-- CORREO -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   th:field="*{correo}"
                                   class="form-control"
                                   maxlength="100">

                        </div>


                        <!-- DIRECCIÓN -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Dirección
                            </label>

                            <input type="text"
                                   th:field="*{direccion}"
                                   class="form-control"
                                   maxlength="150">

                        </div>


                        <!-- FECHA NACIMIENTO -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Fecha de nacimiento
                            </label>

                            <input type="date"
                                   th:field="*{fecha_nacimiento}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- EPS -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                EPS
                            </label>

                            <input type="text"
                                   th:field="*{eps}"
                                   class="form-control"
                                   maxlength="100">

                        </div>


                        <!-- ALERGIAS -->
                        <div class="col-12 mb-3">

                            <label class="form-label">
                                Alergias conocidas
                            </label>

                            <textarea th:field="*{alergias}"
                                      class="form-control"
                                      rows="4"></textarea>

                        </div>

                    </div>


                    <div class="mt-3">

                        <button type="submit"
                                class="btn btn-primary">

                            <span th:text="${editMode ? 'Actualizar cliente' : 'Guardar cliente'}">
                                Guardar cliente
                            </span>

                        </button>


                        <a th:href="@{/view/clientes}"
                           class="btn btn-white">

                            Cancelar

                        </a>

                    </div>

                </form>

            </section>

        </main>

    </div>

</div>

</body>
</html>
