<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('clientes')}">
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-wrapper">

        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar}">
        </header>

        <main class="dashboard-content">

            <!-- ENCABEZADO -->
            <section class="page-header">

                <div class="page-title">

                    <h1 th:text="${pageTitle}">
                        Gestión de Clientes
                    </h1>

                    <p th:text="${pageSubtitle}">
                        Consulta y seguimiento de los clientes de la farmacia.
                    </p>

                </div>

                <div class="page-actions">

                    <a th:href="@{/view/usuarios/form}"
                       class="btn btn-primary">

                        <i class="fa-solid fa-user-plus"></i>

                        <span>
                            Nuevo cliente
                        </span>

                    </a>

                </div>

            </section>

            <!-- MENSAJE -->
            <div th:if="${success}"
                 class="alert-banner success"
                 th:text="${success}">
            </div>

            <!-- TABLA -->
            <section class="table-card surface">

                <div class="table-header">

                    <span class="card-title">
                        Consulta y Seguimiento
                    </span>

                    <form method="get"
                          th:action="@{/view/clientes}"
                          class="search-form">

                        <input name="search"
                               type="search"
                               th:value="${search}"
                               placeholder="Buscar por nombre o documento"
                               class="search-input search-field">

                        <button type="submit"
                                class="btn btn-white nowrap">

                            Buscar

                        </button>

                    </form>

                </div>

                <div class="overflow-x-auto">

                    <table class="custom-table">

                        <thead>

                        <tr>

                            <th>
                                Cliente
                            </th>

                            <th>
                                Documento
                            </th>

                            <th>
                                Teléfono
                            </th>

                            <th>
                                Correo
                            </th>

                            <th>
                                EPS
                            </th>

                            <th>
                                Acciones
                            </th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="cliente : ${clientes}">

                            <!-- CLIENTE -->
                            <td>

                                <div class="med-cell">

                                    <div class="med-icon">

                                        <i class="fa-solid fa-user"></i>

                                    </div>

                                    <span class="med-name"
                                          th:text="${cliente.nombres + ' ' + (cliente.apellidos != null ? cliente.apellidos : '')}">
                                        Juan Pérez
                                    </span>

                                </div>

                                <span class="text-muted text-small"
                                      th:text="'ID: ' + ${cliente.id_cliente}">
                                    ID: 1
                                </span>

                            </td>

                            <!-- DOCUMENTO -->
                            <td th:text="${cliente.documento}">
                                123456789
                            </td>

                            <!-- TELÉFONO -->
                            <td th:text="${cliente.telefono != null && !cliente.telefono.isEmpty() ? cliente.telefono : '—'}">
                                3001234567
                            </td>

                            <!-- CORREO -->
                            <td th:text="${cliente.correo != null && !cliente.correo.isEmpty() ? cliente.correo : '—'}">
                                cliente@gmail.com
                            </td>

                            <!-- EPS -->
                            <td th:text="${cliente.eps != null && !cliente.eps.isEmpty() ? cliente.eps : '—'}">
                                SURA
                            </td>

                            <!-- ACCIONES -->
                            <td class="user-table-actions">

                                <div class="table-actions-row">

                                    <a th:href="@{'/view/clientes/edit/' + ${cliente.id_cliente}}"
                                       class="btn btn-white">

                                        Editar

                                    </a>

                                    <form method="post"
                                          th:action="@{'/view/clientes/delete/' + ${cliente.id_cliente}}"
                                          class="action-form">

                                        <button type="submit"
                                                class="btn btn-white"
                                                onclick="return confirm('¿Eliminar este cliente?')">

                                            Eliminar

                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                        <!-- SIN CLIENTES -->
                        <tr th:if="${#lists.isEmpty(clientes)}">

                            <td colspan="6"
                                class="table-empty">

                                No existen clientes registrados.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

                <!-- FOOTER -->
                <div class="table-footer">

                    Total clientes:

                    <span th:text="${#lists.size(clientes)}">
                        0
                    </span>

                </div>

            </section>

        </main>

    </div>

</div>

</body>
</html>
