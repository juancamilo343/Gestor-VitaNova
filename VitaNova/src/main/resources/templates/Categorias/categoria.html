<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>


<body>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside th:replace="~{fragments/layout :: sidebar('categorias')}">
  </aside>


  <div class="main-wrapper">

    <!-- TOPBAR -->
    <header th:replace="~{fragments/layout :: topbar}">
    </header>


    <main class="dashboard-content">


      <!-- ENCABEZADO -->
      <section class="page-header">

        <div class="page-title">

          <h1 th:text="${pageTitle}">
            Gestión de Categorías
          </h1>

          <p th:text="${pageSubtitle}">
            Consulta y seguimiento de las categorías de productos.
          </p>

        </div>


        <div class="page-actions">

          <!-- SOLO ADMINISTRADOR Y FARMACÉUTICO -->
          <a th:if="${puedeModificar}"
             th:href="@{/view/categorias/form}"
             class="btn btn-primary">

            <i class="fa-solid fa-folder-plus"></i>

            <span>
                            Nueva categoría
                        </span>

          </a>

        </div>

      </section>


      <!-- MENSAJE ÉXITO -->
      <div th:if="${success}"
           class="alert-banner success"
           th:text="${success}">
      </div>


      <!-- MENSAJE ERROR -->
      <div th:if="${error}"
           class="alert-banner error"
           th:text="${error}">
      </div>


      <!-- TABLA -->
      <section class="table-card surface">


        <div class="table-header">

                    <span class="card-title">
                        Consulta y Seguimiento
                    </span>


          <form method="get"
                th:action="@{/view/categorias}"
                class="search-form">

            <input name="search"
                   type="search"
                   th:value="${search}"
                   placeholder="Buscar por nombre"
                   class="search-input search-field">


            <button type="submit"
                    class="btn btn-white nowrap">

              Buscar

            </button>

          </form>

        </div>


        <div class="overflow-x-auto">

          <table class="custom-table">


            <thead>

            <tr>

              <th>
                Categoría
              </th>

              <th>
                Descripción
              </th>

              <th>
                Acciones
              </th>

            </tr>

            </thead>


            <tbody>


            <tr th:each="categoria : ${categorias}">


              <td>

                <div class="med-cell">

                  <div class="med-icon">

                    <i class="fa-solid fa-folder"></i>

                  </div>


                  <span class="med-name"
                        th:text="${categoria.nombre}">

                                        Medicamentos

                                    </span>

                </div>


                <span class="text-muted text-small"
                      th:text="'ID: ' + ${categoria.id_categoria}">

                                    ID: 1

                                </span>

              </td>


              <td>

                                <span th:text="${categoria.descripcion != null ? categoria.descripcion : '—'}">

                                    Descripción de la categoría

                                </span>

              </td>


              <td class="user-table-actions">


                <!-- ADMINISTRADOR Y FARMACÉUTICO -->
                <div th:if="${puedeModificar}"
                     class="table-actions-row">


                  <a th:href="@{'/view/categorias/edit/' + ${categoria.id_categoria}}"
                     class="btn btn-white">

                    Editar

                  </a>


                  <form method="post"
                        th:action="@{'/view/categorias/delete/' + ${categoria.id_categoria}}"
                        class="action-form">

                    <button type="submit"
                            class="btn btn-white"
                            onclick="return confirm('¿Eliminar esta categoría?')">

                      Eliminar

                    </button>

                  </form>


                </div>


                <!-- VENDEDOR Y AUXILIAR -->
                <span th:unless="${puedeModificar}"
                      class="text-muted text-small">

                                    Solo lectura

                                </span>


              </td>

            </tr>


            <tr th:if="${#lists.isEmpty(categorias)}">

              <td colspan="3"
                  class="table-empty">

                No existen categorías registradas.

              </td>

            </tr>


            </tbody>

          </table>

        </div>


        <div class="table-footer">

          Total categorías:

          <span th:text="${#lists.size(categorias)}">

                        0

                    </span>

        </div>


      </section>


    </main>

  </div>

</div>

</body>

</html>
