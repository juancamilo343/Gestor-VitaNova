<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | VitaNova</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="login-shell">
    <section class="login-card">
        <h1>VitaNova</h1>
        <p>Gestor de radicación documental</p>

        <p class="login-error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
        <p class="login-info" th:if="${param.logout}">Sesión finalizada correctamente.</p>

        <form th:action="@{/login}" method="post">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" required autocomplete="username" autofocus>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">

            <button type="submit">Ingresar</button>
        </form>
    </section>
</main>
</body>
</html>
