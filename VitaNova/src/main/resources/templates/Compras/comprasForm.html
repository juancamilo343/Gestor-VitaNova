<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('compras')}">
    </aside>


    <div class="main-wrapper">

        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar}">
        </header>


        <main class="dashboard-content">

            <!-- ENCABEZADO -->
            <section class="page-header">

                <div class="page-title">

                    <h1 th:text="${pageTitle}">
                        Nueva Compra
                    </h1>

                    <p th:text="${pageSubtitle}">
                        Registre una nueva compra realizada a un proveedor.
                    </p>

                </div>


                <div class="page-actions">

                    <a th:href="@{/view/compras}"
                       class="btn btn-white">

                        <i class="fa-solid fa-arrow-left"></i>

                        Volver

                    </a>

                </div>

            </section>


            <!-- FORMULARIO -->
            <section class="form-box">

                <form th:action="@{/view/compras/save}"
                      th:object="${compra}"
                      method="post">

                    <input type="hidden"
                           th:field="*{id_compra}">


                    <!-- =========================================
                         INFORMACIÓN DE LA COMPRA
                    ========================================== -->
                    <div class="form-section">

                        <h2 class="form-section-title">
                            Información de la compra
                        </h2>

                        <div class="form-section-divider">
                        </div>


                        <div class="form-grid">

                            <!-- PROVEEDOR -->

                            <div class="field-group">

                                <label for="id_proveedor">
                                    Proveedor
                                </label>

                                <select id="id_proveedor"
                                        th:field="*{id_proveedor}"
                                        required>

                                    <option value="">
                                        Seleccione
                                    </option>

                                    <option th:each="proveedor : ${proveedores}"
                                            th:value="${proveedor.id_proveedor}"
                                            th:text="${proveedor.nombre}">
                                        Proveedor
                                    </option>

                                </select>

                            </div>


                            <!-- FECHA -->

                            <div class="field-group">

                                <label for="fecha">
                                    Fecha
                                </label>

                                <input id="fecha"
                                       type="date"
                                       th:field="*{fecha}"
                                       required>

                            </div>


                            <!-- ESTADO -->

                            <div class="field-group">

                                <label for="estado">
                                    Estado
                                </label>

                                <select id="estado"
                                        th:field="*{estado}"
                                        required>

                                    <option value="PENDIENTE">
                                        Pendiente
                                    </option>

                                    <option value="RECIBIDA">
                                        Recibida
                                    </option>

                                    <option value="CANCELADA">
                                        Cancelada
                                    </option>

                                </select>

                            </div>


                            <!-- TOTAL -->

                            <div class="field-group">

                                <label for="total">
                                    Total
                                </label>

                                <input id="total"
                                       type="number"
                                       step="0.01"
                                       min="0"
                                       th:field="*{total}"
                                       readonly>

                            </div>

                        </div>

                    </div>


                    <!-- =========================================
                         PRODUCTOS
                    ========================================== -->
                    <div class="form-section">

                        <h2 class="form-section-title">
                            Productos de la compra
                        </h2>

                        <div class="form-section-divider">
                        </div>


                        <div id="productos-container">

                            <div class="form-grid producto-row">

                                <!-- PRODUCTO -->

                                <div class="field-group wide">

                                    <label>
                                        Producto
                                    </label>

                                    <select name="id_productos[]"
                                            class="producto-select"
                                            required>

                                        <option value="">
                                            Seleccione un producto
                                        </option>

                                        <option th:each="producto : ${productos}"
                                                th:value="${producto.id_producto}"
                                                th:data-precio="${producto.precio_compra}"
                                                th:text="${producto.nombre}">
                                            Producto
                                        </option>

                                    </select>

                                </div>


                                <!-- CANTIDAD -->

                                <div class="field-group">

                                    <label>
                                        Cantidad
                                    </label>

                                    <input type="number"
                                           name="cantidades[]"
                                           class="cantidad-input"
                                           min="1"
                                           value="1"
                                           required>

                                </div>


                                <!-- PRECIO -->

                                <div class="field-group">

                                    <label>
                                        Precio de compra
                                    </label>

                                    <input type="number"
                                           name="precios[]"
                                           class="precio-input"
                                           step="0.01"
                                           min="0"
                                           value="0"
                                           required>

                                </div>


                                <!-- SUBTOTAL -->

                                <div class="field-group">

                                    <label>
                                        Subtotal
                                    </label>

                                    <input type="number"
                                           class="subtotal-input"
                                           step="0.01"
                                           value="0"
                                           readonly>

                                </div>

                            </div>

                        </div>


                        <!-- AGREGAR PRODUCTO -->

                        <div class="form-actions">

                            <button type="button"
                                    id="agregar-producto"
                                    class="btn btn-white">

                                <i class="fa-solid fa-plus"></i>

                                Agregar producto

                            </button>

                        </div>

                    </div>


                    <!-- =========================================
                         TOTAL
                    ========================================== -->
                    <div class="form-section">

                        <div class="form-grid">

                            <div class="field-group">

                                <label>
                                    Total de la compra
                                </label>

                                <input type="number"
                                       id="totalCompra"
                                       step="0.01"
                                       value="0"
                                       readonly>

                            </div>

                        </div>

                    </div>


                    <!-- =========================================
                         ACCIONES
                    ========================================== -->
                    <div class="form-actions">

                        <a th:href="@{/view/compras}"
                           class="btn btn-white">

                            Cancelar

                        </a>


                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fa-solid fa-save"></i>

                            Guardar compra

                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const container =
            document.getElementById("productos-container");

        const agregarBtn =
            document.getElementById("agregar-producto");

        const totalCompra =
            document.getElementById("totalCompra");

        const totalHidden =
            document.getElementById("total");


        function calcularFila(row) {

            const cantidad =
                row.querySelector(".cantidad-input");

            const precio =
                row.querySelector(".precio-input");

            const subtotal =
                row.querySelector(".subtotal-input");

            const cantidadValor =
                parseFloat(cantidad.value) || 0;

            const precioValor =
                parseFloat(precio.value) || 0;

            const resultado =
                cantidadValor * precioValor;

            subtotal.value =
                resultado.toFixed(2);

            calcularTotal();
        }


        function calcularTotal() {

            let total = 0;

            document
                .querySelectorAll(".subtotal-input")
                .forEach(function (input) {

                    total +=
                        parseFloat(input.value) || 0;

                });

            totalCompra.value =
                total.toFixed(2);

            totalHidden.value =
                total.toFixed(2);
        }


        function configurarFila(row) {

            const producto =
                row.querySelector(".producto-select");

            const cantidad =
                row.querySelector(".cantidad-input");

            const precio =
                row.querySelector(".precio-input");


            producto.addEventListener("change", function () {

                const opcion =
                    producto.options[producto.selectedIndex];

                const precioProducto =
                    opcion.getAttribute("data-precio");

                if (precioProducto !== null) {

                    precio.value =
                        precioProducto;

                }

                calcularFila(row);

            });


            cantidad.addEventListener(
                "input",
                function () {

                    calcularFila(row);

                }
            );


            precio.addEventListener(
                "input",
                function () {

                    calcularFila(row);

                }
            );

        }


        configurarFila(
            container.querySelector(".producto-row")
        );


        agregarBtn.addEventListener(
            "click",
            function () {

                const primeraFila =
                    container.querySelector(".producto-row");

                const nuevaFila =
                    primeraFila.cloneNode(true);


                nuevaFila
                    .querySelector(".producto-select")
                    .value = "";


                nuevaFila
                    .querySelector(".cantidad-input")
                    .value = "1";


                nuevaFila
                    .querySelector(".precio-input")
                    .value = "0";


                nuevaFila
                    .querySelector(".subtotal-input")
                    .value = "0";


                container.appendChild(nuevaFila);

                configurarFila(nuevaFila);

            }
        );


        calcularTotal();

    });

</script>

</body>
</html>
