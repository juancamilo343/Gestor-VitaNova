<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})">
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('compras')}">
    </aside>


    <div class="main-wrapper">

        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar}">
        </header>


        <main class="dashboard-content">

            <!-- ENCABEZADO -->
            <section class="page-header">

                <div class="page-title">

                    <h1 th:text="${pageTitle}">
                        Agregar producto
                    </h1>

                    <p th:text="${pageSubtitle}">
                        Agregue un producto a la compra seleccionada.
                    </p>

                </div>


                <div class="page-actions">

                    <a th:href="@{'/view/compras/' + ${compra.id_compra} + '/detalles'}"
                       class="btn btn-white">

                        <i class="fa-solid fa-arrow-left"></i>

                        Volver

                    </a>

                </div>

            </section>


            <!-- FORMULARIO -->
            <section class="form-box">

                <form th:action="@{'/view/compras/' + ${compra.id_compra} + '/detalles/save'}"
                      th:object="${detalle}"
                      method="post"
                      novalidate>

                    <input type="hidden"
                           th:field="*{id_detalle_compra}">


                    <input type="hidden"
                           th:field="*{id_compra}">


                    <!-- INFORMACIÓN -->
                    <div class="form-section">

                        <h2 class="form-section-title">
                            Producto
                        </h2>

                        <div class="form-section-divider">
                        </div>


                        <div class="form-grid">

                            <div class="field-group wide">

                                <label for="id_producto">
                                    Producto
                                </label>

                                <select id="id_producto"
                                        th:field="*{id_producto}"
                                        required>

                                    <option value="">
                                        Seleccione un producto
                                    </option>

                                    <option th:each="producto : ${productos}"
                                            th:value="${producto.id_producto}"
                                            th:text="${producto.nombre}">
                                        Producto
                                    </option>

                                </select>

                            </div>


                            <div class="field-group">

                                <label for="cantidad">
                                    Cantidad
                                </label>

                                <input id="cantidad"
                                       type="number"
                                       min="1"
                                       th:field="*{cantidad}"
                                       required>

                            </div>


                            <div class="field-group">

                                <label for="precio_compra">
                                    Precio de compra
                                </label>

                                <input id="precio_compra"
                                       type="number"
                                       step="0.01"
                                       min="0"
                                       th:field="*{precio_compra}"
                                       required>

                            </div>

                        </div>

                    </div>


                    <!-- INFORMACIÓN CALCULADA -->
                    <div class="form-section">

                        <h2 class="form-section-title">
                            Información de la compra
                        </h2>

                        <div class="form-section-divider">
                        </div>


                        <div class="form-grid">

                            <div class="field-group">

                                <label>
                                    Compra
                                </label>

                                <input type="text"
                                       th:value="'Compra #' + ${compra.id_compra}"
                                       readonly>

                            </div>


                            <div class="field-group">

                                <label>
                                    Proveedor
                                </label>

                                <input type="text"
                                       th:value="${compra.proveedor != null ? compra.proveedor.nombre : '—'}"
                                       readonly>

                            </div>


                            <div class="field-group">

                                <label>
                                    Subtotal
                                </label>

                                <input type="text"
                                       id="subtotalVisual"
                                       th:value="${detalle.subtotal != null ? detalle.subtotal : 0}"
                                       readonly>

                            </div>

                        </div>

                    </div>


                    <!-- ACCIONES -->
                    <div class="form-actions">

                        <a th:href="@{'/view/compras/' + ${compra.id_compra} + '/detalles'}"
                           class="btn btn-white">

                            Cancelar

                        </a>


                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fa-solid fa-save"></i>

                            Guardar producto

                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</div>


<!-- CALCULAR SUBTOTAL -->
<script>

    const cantidad =
        document.getElementById('cantidad');

    const precio =
        document.getElementById('precio_compra');

    const subtotal =
        document.getElementById('subtotalVisual');


    function calcularSubtotal() {

        const cantidadValue =
            parseFloat(cantidad.value) || 0;

        const precioValue =
            parseFloat(precio.value) || 0;

        const resultado =
            cantidadValue * precioValue;

        subtotal.value =
            resultado.toFixed(2);
    }


    cantidad.addEventListener(
        'input',
        calcularSubtotal
    );

    precio.addEventListener(
        'input',
        calcularSubtotal
    );

    calcularSubtotal();

</script>

</body>
</html>
