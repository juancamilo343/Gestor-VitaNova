<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})">
</head>

<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/layout :: sidebar('lotes')}">
    </aside>


    <div class="main-wrapper">

        <!-- TOPBAR -->
        <header th:replace="~{fragments/layout :: topbar}">
        </header>


        <main class="dashboard-content">

            <section class="page-header">

                <div class="page-title">

                    <h1 th:text="${pageTitle}">
                        Nuevo Lote
                    </h1>

                    <p th:text="${pageSubtitle}">
                        Registre un nuevo lote para controlar la cantidad y vencimiento del producto.
                    </p>

                </div>


                <div class="page-actions">

                    <a th:href="@{/view/lotes}"
                       class="btn btn-white">

                        <i class="fa-solid fa-arrow-left"></i>

                        <span>
                            Volver
                        </span>

                    </a>

                </div>

            </section>


            <!-- MENSAJE DE ERROR -->
            <div th:if="${error}"
                 class="alert-banner error"
                 th:text="${error}">
            </div>


            <section class="form-box">

                <form th:action="@{/view/lotes/save}"
                      th:object="${lote}"
                      method="post"
                      novalidate>

                    <input type="hidden"
                           th:field="*{id_lote}">


                    <!-- INFORMACIÓN DEL LOTE -->
                    <div class="form-section">

                        <h2 class="form-section-title">
                            Información del lote
                        </h2>

                        <div class="form-section-divider">
                        </div>


                        <div class="form-grid">

                            <!-- PRODUCTO -->
                            <div class="field-group wide">

                                <label for="id_producto">
                                    Producto
                                </label>

                                <select id="id_producto"
                                        th:field="*{id_producto}"
                                        required>

                                    <option value="">
                                        Seleccione un producto
                                    </option>

                                    <option th:each="producto : ${productos}"
                                            th:value="${producto.id_producto}"
                                            th:text="${producto.nombre}">
                                    </option>

                                </select>

                            </div>


                            <!-- NÚMERO DE LOTE -->
                            <div class="field-group">

                                <label for="numero_lote">
                                    Número de lote
                                </label>

                                <input id="numero_lote"
                                       type="text"
                                       th:field="*{numero_lote}"
                                       maxlength="50"
                                       placeholder="Ej: AC001">

                            </div>


                            <!-- CANTIDAD -->
                            <div class="field-group">

                                <label for="cantidad">
                                    Cantidad
                                </label>

                                <input id="cantidad"
                                       type="number"
                                       th:field="*{cantidad}"
                                       min="0"
                                       required
                                       placeholder="Ej: 50">

                            </div>


                            <!-- FECHA FABRICACIÓN -->
                            <div class="field-group">

                                <label for="fecha_fabricacion">
                                    Fecha de fabricación
                                </label>

                                <input id="fecha_fabricacion"
                                       type="date"
                                       th:field="*{fecha_fabricacion}">

                            </div>


                            <!-- FECHA VENCIMIENTO -->
                            <div class="field-group">

                                <label for="fecha_vencimiento">
                                    Fecha de vencimiento
                                </label>

                                <input id="fecha_vencimiento"
                                       type="date"
                                       th:field="*{fecha_vencimiento}">

                            </div>


                            <!-- ESTADO -->
                            <div class="field-group">

                                <label for="estado">
                                    Estado
                                </label>

                                <select id="estado"
                                        th:field="*{estado}"
                                        required>

                                    <option value="">
                                        Seleccione un estado
                                    </option>

                                    <option value="ACTIVO">
                                        Activo
                                    </option>

                                    <option value="VENCIDO">
                                        Vencido
                                    </option>

                                    <option value="RETIRADO">
                                        Retirado
                                    </option>

                                    <option value="AGOTADO">
                                        Agotado
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <!-- ACCIONES -->
                    <div class="form-actions">

                        <a th:href="@{/view/lotes}"
                           class="btn btn-white">

                            Cancelar

                        </a>


                        <button type="submit"
                                class="btn btn-primary">

                            Guardar lote

                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</div>

</body>
</html>
