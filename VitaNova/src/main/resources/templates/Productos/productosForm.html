<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${pageTitle})}">
</head>

<body>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside th:replace="~{fragments/layout :: sidebar('productos')}">
  </aside>


  <div class="main-wrapper">

    <!-- TOPBAR -->
    <header th:replace="~{fragments/layout :: topbar}">
    </header>


    <main class="dashboard-content">

      <section class="page-header">

        <div class="page-title">

          <h1 th:text="${pageTitle}">
            Nuevo Producto
          </h1>

          <p th:text="${pageSubtitle}">
            Registre un nuevo producto dentro del sistema VitaNova.
          </p>

        </div>


        <div class="page-actions">

          <a th:href="@{/view/productos}"
             class="btn btn-white">

            <i class="fa-solid fa-arrow-left"></i>

            <span>
                            Volver
                        </span>

          </a>

        </div>

      </section>


      <!-- MENSAJE DE ERROR -->
      <div th:if="${error}"
           class="alert-banner error"
           th:text="${error}">
      </div>


      <section class="form-box">

        <form th:action="@{/view/productos/save}"
              th:object="${producto}"
              method="post"
              novalidate>

          <input type="hidden"
                 th:field="*{id_producto}">


          <!-- INFORMACIÓN GENERAL -->
          <div class="form-section">

            <h2 class="form-section-title">
              Información general
            </h2>

            <div class="form-section-divider">
            </div>


            <div class="form-grid">

              <div class="field-group wide">

                <label for="nombre">
                  Nombre del producto
                </label>

                <input id="nombre"
                       type="text"
                       th:field="*{nombre}"
                       required
                       placeholder="Ej: Acetaminofén 500 mg">

              </div>


              <div class="field-group">

                <label for="codigo_interno">
                  Código interno
                </label>

                <input id="codigo_interno"
                       type="text"
                       th:field="*{codigo_interno}"
                       placeholder="Ej: MED-001">

              </div>


              <!-- CÓDIGO DE BARRAS -->
              <div class="field-group wide">

                <label for="codigo_barras">
                  Código de barras
                </label>

                <input id="codigo_barras"
                       type="text"
                       th:field="*{codigo_barras}"
                       placeholder="Escriba o escanee el código de barras"
                       autocomplete="off">


                <!-- VISTA DEL CÓDIGO DE BARRAS -->
                <div id="barcode-container"
                     style="margin-top: 15px; padding: 15px; border: 1px solid #e5e7eb; border-radius: 8px; background: #ffffff; text-align: center; display: none;">

                                    <span style="display: block; margin-bottom: 10px; font-size: 13px; color: #6b7280;">
                                        Vista previa del código de barras
                                    </span>

                  <svg id="barcode"></svg>

                </div>

              </div>


              <div class="field-group wide">

                <label for="descripcion">
                  Descripción
                </label>

                <textarea id="descripcion"
                          th:field="*{descripcion}"
                          rows="4"
                          placeholder="Descripción del producto"></textarea>

              </div>

            </div>

          </div>


          <!-- PRECIOS -->
          <div class="form-section">

            <h2 class="form-section-title">
              Información comercial
            </h2>

            <div class="form-section-divider">
            </div>


            <div class="form-grid">

              <div class="field-group">

                <label for="precio_compra">
                  Precio de compra
                </label>

                <input id="precio_compra"
                       type="number"
                       step="0.01"
                       min="0"
                       th:field="*{precio_compra}"
                       placeholder="0.00">

              </div>


              <div class="field-group">

                <label for="precio_venta">
                  Precio de venta
                </label>

                <input id="precio_venta"
                       type="number"
                       step="0.01"
                       min="0"
                       th:field="*{precio_venta}"
                       placeholder="0.00">

              </div>


              <div class="field-group">

                <label for="ubicacion">
                  Ubicación
                </label>

                <input id="ubicacion"
                       type="text"
                       th:field="*{ubicacion}"
                       placeholder="Ej: Estante A-01">

              </div>

            </div>

          </div>


          <!-- CLASIFICACIÓN -->
          <div class="form-section">

            <h2 class="form-section-title">
              Clasificación y proveedor
            </h2>

            <div class="form-section-divider">
            </div>


            <div class="form-grid">

              <div class="field-group">

                <label for="id_categoria">
                  Categoría
                </label>

                <select id="id_categoria"
                        th:field="*{id_categoria}"
                        required>

                  <option value="">
                    Seleccione
                  </option>

                  <option th:each="categoria : ${categorias}"
                          th:value="${categoria.id_categoria}"
                          th:text="${categoria.nombre}">
                    Categoría
                  </option>

                </select>

              </div>


              <div class="field-group">

                <label for="id_proveedor">
                  Proveedor
                </label>

                <select id="id_proveedor"
                        th:field="*{id_proveedor}"
                        required>

                  <option value="">
                    Seleccione
                  </option>

                  <option th:each="proveedor : ${proveedores}"
                          th:value="${proveedor.id_proveedor}"
                          th:text="${proveedor.nombre}">
                    Proveedor
                  </option>

                </select>

              </div>


              <div class="field-group">

                <label for="estado">
                  Estado
                </label>

                <select id="estado"
                        th:field="*{estado}"
                        required>

                  <option value="ACTIVO">
                    Activo
                  </option>

                  <option value="INACTIVO">
                    Inactivo
                  </option>

                  <option value="AGOTADO">
                    Agotado
                  </option>

                </select>

              </div>

            </div>

          </div>


          <!-- ACCIONES -->
          <div class="form-actions">

            <a th:href="@{/view/productos}"
               class="btn btn-white">

              Cancelar

            </a>


            <button type="submit"
                    class="btn btn-primary">

              Guardar producto

            </button>

          </div>

        </form>

      </section>

    </main>

  </div>

</div>


<!-- LIBRERÍA PARA GENERAR CÓDIGOS DE BARRAS -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>


<!-- FUNCIONALIDAD DEL CÓDIGO DE BARRAS -->
<script>

  document.addEventListener("DOMContentLoaded", function () {

    const codigoBarras =
            document.getElementById("codigo_barras");

    const barcode =
            document.getElementById("barcode");

    const barcodeContainer =
            document.getElementById("barcode-container");


    function generarCodigoBarras() {

      const valor =
              codigoBarras.value.trim();


      // Si no hay código, ocultamos la vista previa
      if (valor === "") {

        barcodeContainer.style.display = "none";

        barcode.innerHTML = "";

        return;
      }


      // Mostramos la vista previa
      barcodeContainer.style.display = "block";


      // Generamos el código de barras
      JsBarcode("#barcode", valor, {

        format: "CODE128",

        lineColor: "#000000",

        width: 2,

        height: 70,

        displayValue: true,

        fontSize: 14,

        margin: 10,

        background: "#ffffff"

      });

    }


    // Generar mientras el usuario escribe
    codigoBarras.addEventListener(
            "input",
            function () {

              generarCodigoBarras();

            }
    );


    // Generar automáticamente al abrir el formulario
    // Esto permite que funcione también al editar
    generarCodigoBarras();

  });

</script>

</body>
</html>
